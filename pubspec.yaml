publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  xc_platform:
    path: ../xc_framework/packages/xc_platform
  xc_ui:
    path: ../xc_framework/packages/xc_ui
  xc_index:
    path: ../xc_index

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
